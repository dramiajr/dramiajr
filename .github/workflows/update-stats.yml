name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.STAT_CODE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate language stats SVG
        run: node scripts/generate-top-langs.js
        env:
          GITHUB_TOKEN: ${{ secrets.STAT_CODE_TOKEN }}

      - name: Verify SVG generation
        run: |
          echo "Current directory:"
          pwd

          echo "Repo files:"
          ls -la

          echo "Profile folder:"
          ls -la profile || echo "profile folder does not exist"

          if [ ! -f profile/top-languages.svg ]; then
            echo "Error: profile/top-languages.svg was not generated"
            exit 1
          fi

          echo "SVG generated successfully:"
          ls -lh profile/top-languages.svg

      - name: Commit updated SVG
        run: |
          git config user.name "David Ramia Jr"
          git config user.email "davidramiajr@gmail.com"

          git add profile/top-languages.svg

          if git diff --cached --quiet; then
            echo "No SVG changes to commit."
            exit 0
          fi

          git commit -m "Update profile language stats"

          git remote set-url origin https://x-access-token:${PROFILE_STATS_TOKEN}@github.com/dramiajr/dramiajr.git
          git push origin HEAD:${GITHUB_REF_NAME}
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.STAT_CODE_TOKEN }}
