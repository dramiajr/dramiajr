name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate language stats SVG
        run: node scripts/generate-top-langs.js
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit updated SVG
        run: |
          git config user.name "David Ramia Jr"
          git config user.email "davidramiajr@gmail.com"

          git add profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No SVG changes to commit."
          else
            git commit -m "Update profile language stats"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
